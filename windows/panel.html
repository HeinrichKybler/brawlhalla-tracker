<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24; --border:#2a2a35;
    --accent:#7c3aed; --accent2:#a855f7; --text:#e2e8f0; --muted:#64748b;
    --success:#22c55e; --danger:#ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { font: 13px/1.3 "Segoe UI", sans-serif; color: var(--text); user-select: none; width: 240px; }

  .titlebar { display: flex; justify-content: space-between; align-items: center;
    background: var(--bg); border-bottom: 0.5px solid var(--border); padding: 7px 12px; }
  .titlebar .lbl { font-size: 12px; color: var(--muted); }
  .status { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.loading { background: var(--accent2); animation: pulse 1s infinite; }
  .dot.loaded { background: var(--success); }
  .dot.error { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .content { padding: 12px; }
  #empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 12px; }

  .ohead { background: var(--surface); border: 0.5px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px; }
  .ohead .otop { display: flex; align-items: center; gap: 10px; }
  .ohead .orank { width: 36px; height: 36px; object-fit: contain; flex: 0 0 auto; }
  .ohead .oinfo { min-width: 0; }
  .ohead .nm { font-size: 15px; font-weight: 500; color: var(--text); }
  .ohead .er { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .ohead .elo { font-size: 18px; font-weight: 500; color: var(--accent2); }
  .badge { font-size: 10px; color: var(--accent2); border: 0.5px solid var(--accent); background: var(--surface2);
    border-radius: 5px; padding: 1px 6px; }
  .ohead .peak { display: flex; justify-content: space-between; border-top: 0.5px solid var(--surface2);
    margin-top: 8px; padding-top: 6px; font-size: 10px; color: var(--muted); }
  .ohead .peak b { color: var(--text); font-weight: 500; }

  .seclabel { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: .5px;
    margin: 10px 2px 6px; }

  .row { background: var(--surface); border: 0.5px solid var(--border); border-radius: 6px;
    padding: 7px 9px; margin-bottom: 5px; }
  .row .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .row .name { font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .row .name span.t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .wr { font-size: 11px; color: var(--success); }
  .row .bar { height: 3px; background: var(--surface2); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .row .bar > span { display: block; height: 100%; background: var(--accent); }
  .row .sub2 { font-size: 9px; color: var(--muted); margin-top: 3px; }
  .row.cur { border-color: var(--accent); }
  .row.cur .bar > span { background: var(--accent2); }
  .row.cur .name::after { content: "hraje teď"; font-size: 9px; color: var(--accent2);
    border: 0.5px solid var(--accent2); border-radius: 4px; padding: 0 4px; margin-left: 6px; }

  #wl { display: flex; gap: 6px; margin-top: 10px; }
  #wl button { flex: 1; padding: 7px; border: 0; border-radius: 6px; color: #fff; font-weight: 600;
    font-size: 12px; cursor: pointer; }
  #win { background: var(--success); } #loss { background: var(--danger); }
</style>
</head>
<body>
  <div class="titlebar">
    <span class="lbl">Soupeř</span>
    <span class="status"><span class="dot" id="dot"></span><span id="dotlbl">čeká</span></span>
  </div>
  <div class="content">
    <div id="empty">Stiskni <b>J</b> ve hře pro scan soupeře.</div>
    <div id="content" style="display:none">
      <div class="ohead">
        <div class="otop">
          <img class="orank" id="oppRank">
          <div class="oinfo">
            <div class="nm" id="name"></div>
            <div class="er"><span class="elo" id="elo"></span><span class="badge" id="tier"></span></div>
          </div>
        </div>
        <div class="peak"><span>Peak</span><b id="peak"></b></div>
      </div>
      <div class="seclabel">Top legendy</div>
      <div id="legends"></div>
      <div class="seclabel">Top zbraně</div>
      <div id="weapons"></div>
      <div id="wl"><button id="win">Výhra</button><button id="loss">Prohra</button></div>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
