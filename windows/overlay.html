<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24; --border:#2a2a35;
    --accent:#7c3aed; --accent2:#a855f7; --text:#e2e8f0; --muted:#64748b;
    --success:#22c55e; --danger:#ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body { font: 13px/1.3 "Segoe UI", sans-serif; color: var(--text); user-select: none; }

  .wrap { height: 100vh; background: rgba(13,13,15,0.92); border: 0.5px solid var(--border);
    border-radius: 10px; backdrop-filter: blur(8px); padding: 10px 14px; display: flex; flex-direction: column; }

  .ohdr { display: flex; justify-content: space-between; align-items: center;
    border-bottom: 0.5px solid var(--surface2); padding-bottom: 7px; margin-bottom: 8px; }
  .ohdr .left { display: flex; align-items: center; gap: 8px; }
  .logo { width: 14px; height: 14px; border-radius: 3px; background: var(--accent); border: 0.5px solid var(--accent2); }
  .ohdr .title { font-size: 11px; color: var(--muted); }
  .ohdr .map { font-size: 11px; color: var(--accent2); }
  .kbd { font-size: 11px; color: var(--muted); background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 5px; padding: 2px 7px; }

  .cols { flex: 1; display: grid; grid-template-columns: 1fr 0.5px 1fr; gap: 12px; min-height: 0; }
  .divider { background: var(--border); }
  .col { min-width: 0; display: flex; flex-direction: column; }

  .nmrow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .nmrow .nm { font-size: 13px; font-weight: 500; }
  .nmrow .nm.me { color: var(--accent2); }
  .tag { font-size: 9px; color: var(--accent2); border: 0.5px solid var(--accent2); border-radius: 4px;
    padding: 0 4px; margin-left: 5px; }
  .nmrow .er { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .nmrow .elo { font-size: 13px; font-weight: 500; color: var(--accent2); }
  .badge { font-size: 9px; color: var(--accent2); border: 0.5px solid var(--accent); background: var(--surface2);
    border-radius: 4px; padding: 1px 5px; }
  .peak { font-size: 9px; color: var(--muted); margin-top: 2px; }

  .lab { font-size: 9px; color: var(--muted); text-transform: lowercase; margin: 7px 0 4px; }
  .chips { display: flex; gap: 5px; }
  .chip { background: var(--surface); border: 0.5px solid var(--border); border-radius: 5px;
    padding: 4px 7px; flex: 1; min-width: 0; }
  .chip.cur { border-color: var(--accent); }
  .chip .cn { font-size: 10px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip .star { color: var(--accent2); }
  .chip .cbar { height: 3px; background: var(--surface2); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .chip .cbar > span { display: block; height: 100%; background: var(--accent); }
  .chip.cur .cbar > span { background: var(--accent2); }
  .chip .cwr { font-size: 9px; color: var(--success); margin-top: 3px; }
  .chips.weapons .chip { padding: 3px 6px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ohdr">
      <div class="left">
        <span class="logo"></span>
        <span class="title">Brawlhalla Tracker</span>
        <span class="map" id="map"></span>
      </div>
      <span class="kbd">ALT+T skrýt</span>
    </div>
    <div class="cols">
      <div class="col" id="colMe"></div>
      <div class="divider"></div>
      <div class="col" id="colOpp"></div>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
