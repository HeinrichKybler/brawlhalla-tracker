<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --accent:#7c3aed; --accent2:#a855f7; --text:#e2e8f0; --muted:#64748b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; user-select: none; }
  .card {
    width: 100vw; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(13,13,15,0.94); border: 0.5px solid #2a2a35; border-radius: 18px;
    backdrop-filter: blur(6px);
    animation: pop .35s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
  .logo { width: 170px; height: 170px; object-fit: contain;
    filter: drop-shadow(0 6px 22px rgba(124,58,237,.55));
    animation: float 2.4s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .title { font: 600 20px "Segoe UI", sans-serif; color: var(--text); letter-spacing: .3px; }
  .sub { font: 12px "Segoe UI", sans-serif; color: var(--muted); }
  .bar { width: 160px; height: 4px; background: #1e1e24; border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .bar > span { display: block; height: 100%; width: 40%; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="../assets/splash.webp" alt="">
    <div class="title">Brawlhalla Tracker</div>
    <div class="sub">Spouštění…</div>
    <div class="bar"><span></span></div>
  </div>
</body>
</html>
